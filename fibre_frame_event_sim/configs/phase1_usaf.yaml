project:
  output_dir: outputs/phase1_usaf
  seed: 1

source:
  path: ../分辨率板.png
  crop_center_px: [790, 789]
  crop_size_px: 720
  output_shape_px: [400, 400]
  pixel_size_um: 0.5
  intensity_floor: 0.05

motion:
  velocity_um_s: [180.0, 0.0]
  duration_s: 0.025
  dt_s: 0.0001

grin:
  fibre_field_size_um: 160.0
  fibre_grid_pixel_size_um: 0.5
  magnification: 1.0
  sigma_um: 0.8
  transmission: 1.0

fibre:
  core_pitch_um: 4.5
  core_diameter_um: 2.9
  lattice: hexagonal
  aperture_supersample: 32
  transmission: 1.0

relay:
  sensor_shape_px: [260, 346]
  sensor_pixel_pitch_um: 18.5
  magnification: fit
  psf_sigma_sensor_um: 0.0
  pixel_integration_supersample: 2

aps:
  exposure_start_s: 0.0
  exposure_end_s: 0.025

events:
  backend: v2e
  pos_threshold: 0.2
  neg_threshold: 0.2
  threshold_sigma: 0.0
  cutoff_hz: 0.0
  leak_rate_hz: 0.0
  shot_noise_rate_hz: 0.0
  refractory_period_s: 0.0
  input_white_dn: 255.0
  device: cuda

