project:
  output_dir: outputs/baseline
  seed: 19
  device: cuda

source:
  path: ../分辨率板.png
  crop_center_px: [790, 789]
  crop_size_px: 720
  intensity_floor: 0.06

sensor:
  shape_px: [192, 192]

fibre:
  core_pitch_px: 5.5
  margin_px: 12.0
  proximal_spot_radius_px: 1.85

recording:
  duration_s: 0.040
  sample_interval_s: 0.0001

motion:
  end_shift_px: [5.5, 0.0]
  curvature_px: 0.0

# These values generate data but are deliberately unavailable to reconstruction.
simulation_only:
  effective_blur_sigma_px: 0.9
  aps_noise_sigma: 0.003
  events:
    contrast_threshold: 0.075
    threshold_log_sigma: 0.07
    background_noise_fraction: 0.01

motion_estimation:
  segment_count: 12
  coarse_search_radius_px: 8
  coarse_search_step_px: 1.0
  coarse_displacement_regularization: 0.20
  iwe_sigma_px: 1.0
  use_aps_event_endpoint_validation: true
  endpoint_validation_shape: [96, 96]
  endpoint_validation_time_samples: 24
  endpoint_validation_time_bins: 6
  endpoint_validation_iwe_sigma_px: 1.0
  endpoint_validation_displacement_weight: 0.0
  endpoint_validation_refinement_radius_px: 0.75
  endpoint_validation_refinement_step_px: 0.25
  endpoint_cmax_agreement_radius_px: 1.0
  path_validation_shape: [96, 96]
  path_validation_time_samples: 24
  path_validation_time_bins: 6
  path_validation_iwe_sigma_px: 1.0
  path_curvature_search_px: [-2.0, 2.0, 0.25]
  path_easing_search_px: [-0.4, 0.4, 0.1]
  path_refinement_step_px: 0.05
  spline_control_count: 6
  spline_validation_shape: [96, 96]
  spline_iterations: 250
  spline_learning_rate: 0.025
  spline_max_control_offset_px: 1.25
  spline_smoothness_weight: 0.12
  spline_deviation_weight: 0.004
  spline_endpoint_weight: 0.05
  spline_min_event_improvement_fraction: 0.08
  spline_time_samples: 48
  spline_time_bins: 1
  spline_iwe_sigma_px: 1.0
  spline_joint_refinement: true
  spline_joint_shape: [96, 96]
  spline_joint_iterations: 220
  spline_joint_warmup_iterations: 100
  spline_joint_image_lr: 0.02
  spline_joint_motion_lr: 0.015
  spline_joint_max_control_offset_px: 0.75
  spline_joint_event_weight: 0.010
  spline_joint_image_regularization_weight: 0.003
  spline_joint_smoothness_weight: 0.12
  spline_joint_deviation_weight: 0.003
  spline_joint_endpoint_weight: 0.02
  spline_joint_time_samples: 48
  spline_joint_time_bins: 1
  spline_joint_iwe_sigma_px: 1.0

reconstruction:
  multiscale_shapes: [[96, 96], [192, 192]]
  iterations_per_scale: [250, 450]
  event_only_iterations_per_scale: [300, 500]
  learning_rate: 0.025
  event_weight: 0.005
  regularization_weight: 0.003
  event_only_regularization_weight: 0.003
  event_only_gauge_weight: 0.20
  event_only_mean: 0.50
  event_only_std: 0.22
  aps_huber_beta: 0.03
  aps_time_samples: 24
  observability_time_samples: 48
  event_time_bins: 1
  iwe_sigma_px: 1.0
