project:
  output_dir: outputs/complex_motion
  seed: 41
  device: cuda

source:
  path: ../分辨率板.png
  crop_center_px: [790, 789]
  crop_size_px: 720
  intensity_floor: 0.06

sensor:
  shape_px: [192, 192]

fibre:
  core_pitch_px: 5.5
  margin_px: 12.0
  proximal_spot_radius_px: 1.85

recording:
  duration_s: 0.040
  sample_interval_s: 0.0001

# PCHIP keyframes create a stop, reversal, and two rapid direction changes.
motion:
  model: keyframes
  keyframe_times: [0.0, 0.16, 0.30, 0.42, 0.53, 0.62, 0.70, 0.84, 1.0]
  keyframe_positions_px:
    - [0.0, 0.0]
    - [2.6, 0.7]
    - [4.7, 2.6]
    - [4.7, 2.6]
    - [2.7, 4.0]
    - [3.8, 1.6]
    - [3.1, 2.2]
    - [5.4, 4.8]
    - [6.0, 3.8]

simulation_only:
  effective_blur_sigma_px: 0.9
  aps_noise_sigma: 0.003
  events:
    contrast_threshold: 0.075
    threshold_log_sigma: 0.07
    background_noise_fraction: 0.01

motion_estimation:
  model: bspline
  segment_count: 20
  coarse_search_radius_px: 8
  coarse_search_step_px: 1.0
  coarse_displacement_regularization: 0.10
  iwe_sigma_px: 1.0
  use_aps_event_endpoint_validation: true
  endpoint_validation_shape: [96, 96]
  endpoint_validation_time_samples: 36
  endpoint_validation_time_bins: 8
  endpoint_validation_iwe_sigma_px: 1.0
  endpoint_validation_displacement_weight: 0.0
  endpoint_validation_refinement_radius_px: 0.75
  endpoint_validation_refinement_step_px: 0.25
  endpoint_cmax_agreement_radius_px: 1.0
  path_validation_shape: [96, 96]
  path_validation_time_samples: 36
  path_validation_time_bins: 8
  path_validation_iwe_sigma_px: 1.0
  path_curvature_search_px: [-3.0, 3.0, 0.3]
  path_easing_search_px: [-0.6, 0.6, 0.15]
  path_refinement_step_px: 0.05
  spline_control_count: 9
  spline_validation_shape: [96, 96]
  spline_iterations: 600
  spline_learning_rate: 0.03
  spline_max_control_offset_px: 5.0
  spline_smoothness_weight: 0.02
  spline_deviation_weight: 0.0002
  spline_endpoint_weight: 0.0
  spline_min_event_improvement_fraction: 0.08
  spline_time_samples: 60
  spline_time_bins: 10
  spline_iwe_sigma_px: 1.0
  spline_joint_refinement: true
  spline_joint_shape: [96, 96]
  spline_joint_iterations: 360
  spline_joint_warmup_iterations: 120
  spline_joint_image_lr: 0.02
  spline_joint_motion_lr: 0.02
  spline_joint_max_control_offset_px: 2.0
  spline_joint_event_weight: 0.020
  spline_joint_image_regularization_weight: 0.004
  spline_joint_smoothness_weight: 0.05
  spline_joint_deviation_weight: 0.0005
  spline_joint_endpoint_weight: 0.0
  spline_joint_time_samples: 60
  spline_joint_time_bins: 10
  spline_joint_iwe_sigma_px: 1.0

reconstruction:
  multiscale_shapes: [[96, 96], [192, 192]]
  iterations_per_scale: [300, 550]
  event_only_iterations_per_scale: [350, 600]
  learning_rate: 0.025
  event_weight: 0.008
  regularization_weight: 0.004
  event_only_regularization_weight: 0.003
  event_only_gauge_weight: 0.20
  event_only_mean: 0.50
  event_only_std: 0.22
  aps_huber_beta: 0.03
  aps_time_samples: 36
  observability_time_samples: 72
  event_time_bins: 10
  iwe_sigma_px: 1.0
