project:
  output_dir: outputs/two_dimensional
  seed: 29
  device: cuda

source:
  path: ../分辨率板.png
  crop_center_px: [790, 789]
  crop_size_px: 720
  intensity_floor: 0.06

sensor:
  shape_px: [192, 192]

fibre:
  core_pitch_px: 5.5
  margin_px: 12.0
  proximal_spot_radius_px: 1.85

recording:
  duration_s: 0.040
  sample_interval_s: 0.0001

# Diagonal displacement plus a perpendicular arc gives changing x/y velocity.
motion:
  end_shift_px: [5.5, 4.75]
  curvature_px: 1.6

# These values generate data but are deliberately unavailable to reconstruction.
simulation_only:
  effective_blur_sigma_px: 0.9
  aps_noise_sigma: 0.003
  events:
    contrast_threshold: 0.075
    threshold_log_sigma: 0.07
    background_noise_fraction: 0.01

motion_estimation:
  segment_count: 12
  coarse_search_radius_px: 8
  coarse_search_step_px: 1.0
  coarse_displacement_regularization: 0.12
  iwe_sigma_px: 1.0
  use_aps_event_endpoint_validation: true
  endpoint_validation_shape: [96, 96]
  endpoint_validation_time_samples: 24
  endpoint_validation_time_bins: 6
  endpoint_validation_iwe_sigma_px: 1.0
  endpoint_validation_displacement_weight: 0.0
  endpoint_validation_refinement_radius_px: 0.75
  endpoint_validation_refinement_step_px: 0.25
  endpoint_cmax_agreement_radius_px: 1.0
  path_validation_shape: [96, 96]
  path_validation_time_samples: 24
  path_validation_time_bins: 6
  path_validation_iwe_sigma_px: 1.0
  path_curvature_search_px: [-2.5, 2.5, 0.25]
  path_easing_search_px: [-0.4, 0.4, 0.1]
  path_refinement_step_px: 0.05

reconstruction:
  multiscale_shapes: [[96, 96], [192, 192]]
  iterations_per_scale: [300, 550]
  event_only_iterations_per_scale: [350, 600]
  learning_rate: 0.025
  event_weight: 0.008
  regularization_weight: 0.004
  event_only_regularization_weight: 0.003
  event_only_gauge_weight: 0.20
  event_only_mean: 0.50
  event_only_std: 0.22
  aps_huber_beta: 0.03
  aps_time_samples: 28
  observability_time_samples: 64
  event_time_bins: 8
  iwe_sigma_px: 1.0
